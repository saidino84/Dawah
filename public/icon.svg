<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Border accent -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Book Icon & Soundwaves -->
  <g transform="translate(106, 120)">
    <!-- Left book page -->
    <path d="M150 200 C90 185 30 200 0 215 L0 45 C30 30 90 15 150 30 Z" fill="#f5f5f4" stroke="#d6d3d1" stroke-width="3" />
    <!-- Right book page -->
    <path d="M150 200 C210 185 270 200 300 215 L300 45 C270 30 210 15 150 30 Z" fill="#fafaf9" stroke="#d6d3d1" stroke-width="3" />
    <!-- Spine bookmark ribbon in gold -->
    <path d="M144 26 L156 26 L156 160 L150 148 L144 160 Z" fill="url(#goldGrad)" />
    
    <!-- Soundwave arches representing Deedat's oratory & audio debates -->
    <path d="M60 270 A100 100 0 0 1 240 270" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" />
    <path d="M90 270 A70 70 0 0 1 210 270" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
    <circle cx="150" cy="270" r="16" fill="url(#goldGrad)" />
  </g>
</svg>
